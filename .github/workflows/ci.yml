name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

  extension:
    name: Extension-host, packaged and VSIX verification
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify lint, tests, VSIX and clean install
        run: xvfb-run -a npm run verify

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantsmind-vscode-ai-coder-vsix
          path: quantsmind-vscode-ai-coder-0.1.0.vsix
          if-no-files-found: error
          retention-days: 14
